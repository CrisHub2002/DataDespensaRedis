services:
  redis:
    image: redis/redis-stack-server:7.4.0-v0
    container_name: datadespensa-redis
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: datadespensa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-datadespensa}
      MYSQL_USER: ${MYSQL_USER:-datadespensa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datadespensa}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  app:
    build: .
    profiles: ["app"]
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-dd:}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-datadespensa}
      MYSQL_USER: ${MYSQL_USER:-datadespensa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datadespensa}
    command: ["python", "main.py"]

volumes:
  redis_data:
  mysql_data: